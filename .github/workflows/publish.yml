name: Publish
run-name: Publish - ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # opens or updates the Release PR, or tags and creates a GitHub release when the Release PR is merged
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the package version matches the release
        run: |
          package_version=$(node -p "require('./package/package.json').version")
          if [ "$package_version" != "${{ needs.release-please.outputs.version }}" ]; then
            echo "package/package.json is $package_version but the release is ${{ needs.release-please.outputs.version }}"
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build package
        run: make package

      - name: Publish
        working-directory: package
        run: npm publish --access public --provenance
        env:
          # npm uses trusted publishing when it's set up and falls back to this token.
          # The token can be removed once trusted publishing works, see the README.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/digital-land-frontend/
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # setuptools-scm needs the tags to work out the version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the package version matches the release
        run: |
          ls dist/
          ls dist/digital_land_frontend-${{ needs.release-please.outputs.version }}-py3-none-any.whl

      - uses: pypa/gh-action-pypi-publish@release/v1
